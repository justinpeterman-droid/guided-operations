name: Database quality

on:
  pull_request:
    paths:
      - "supabase/**"
      - "src/lib/supabase/database.generated.ts"
      - "scripts/verify-database-types.mjs"
      - "scripts/verify-production-data-inventory.mjs"
      - "docs/operations/production-data-inventory.json"
      - "docs/operations/production-data-inventory.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "src/lib/supabase/database.generated.ts"
      - "scripts/verify-database-types.mjs"
      - "scripts/verify-production-data-inventory.mjs"
      - "docs/operations/production-data-inventory.json"
      - "docs/operations/production-data-inventory.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Reset, lint, and pgTAP
    runs-on: ubuntu-latest
    # A fresh fictional database replay is short; do not let an unavailable
    # runner block the release evidence for most of an hour.
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use pinned Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Start local PostgreSQL
        run: supabase db start

      - name: Rebuild from migrations and fictional seed
        run: supabase db reset

      - name: Lint database functions
        run: supabase db lint --local --level warning --fail-on warning

      - name: Run pgTAP tests
        run: supabase test db --local

      - name: Verify generated database types
        run: npm run db:types:check

      - name: Verify production data inventory coverage
        run: npm run data:inventory:check

      - name: Stop local PostgreSQL
        if: always()
        run: supabase stop --no-backup
