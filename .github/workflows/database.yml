name: Database quality

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Reset, lint, and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Start local PostgreSQL
        run: supabase db start

      - name: Rebuild from migrations and fictional seed
        run: supabase db reset

      - name: Lint database functions
        run: supabase db lint --local --level warning --fail-on warning

      - name: Run pgTAP tests
        run: supabase test db --local

      - name: Stop local PostgreSQL
        if: always()
        run: supabase stop --no-backup
