name: Authenticated browser quality

on:
  # Cost control: this suite runs ~10 minutes. Running it on every push to a
  # pull-request branch exhausted the private-repository Actions allowance on
  # 2026-08-28. It now runs when a pull request opens or is marked ready, on
  # merges to main, and on demand via workflow_dispatch. Dispatch it manually
  # before merging if the branch changed materially since the last run.
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - ".github/workflows/browser.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "scripts/local-authenticated-browser-qualification-guard.mjs"
      - "scripts/run-local-authenticated-browser-qualification.mjs"
      - "src/**"
      - "supabase/**"
      - "tests/e2e/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "scripts/local-authenticated-browser-qualification-guard.mjs"
      - "scripts/run-local-authenticated-browser-qualification.mjs"
      - "src/**"
      - "supabase/**"
      - "tests/e2e/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticated-browser-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Fictional officer and administrator workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Start isolated local Supabase
        run: supabase start

      - name: Run guarded fictional browser qualification
        run: npm run test:e2e:local-auth

      - name: Retain failure evidence
        if: failure() && hashFiles('test-results/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fictional-browser-failure-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup
