name: Recovery rehearsal

on:
  # Cost control: see the note in browser.yml. Runs on pull-request open or
  # ready-for-review, on merges to main, and on demand.
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - "scripts/rehearse-local-recovery.mjs"
      - "package.json"
      - "supabase/**"
      - ".github/workflows/recovery.yml"
  push:
    branches: [main]
    paths:
      - "scripts/rehearse-local-recovery.mjs"
      - "package.json"
      - "supabase/**"
      - ".github/workflows/recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: Restore database and private Storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Start isolated local Supabase
        run: supabase start

      - name: Rebuild from migrations and fictional seed
        run: supabase db reset

      - name: Rehearse database and Storage recovery
        run: npm run recovery:local

      - name: Retain value-free recovery evidence
        if: always() && hashFiles('test-results/recovery-rehearsal.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-fictional-recovery-${{ github.sha }}
          path: test-results/recovery-rehearsal.json
          if-no-files-found: error
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
