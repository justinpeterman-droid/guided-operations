[project]
name = "guided-operations-policy-ingestion"
version = "0.1.0"
description = "Local, resumable MinerU policy ingestion for Guided Operations"
requires-python = ">=3.10,<3.13"
dependencies = []

[project.optional-dependencies]
import = ["psycopg[binary]>=3.2,<4"]
mineru = ["mineru[all]==3.4.5"]

[project.scripts]
guided-policy-ingest = "guided_policy_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guided_policy_ingestion"]
